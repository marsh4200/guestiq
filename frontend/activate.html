<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GuestIQ · Activate</title>
  <link rel="stylesheet" href="/static/css/style.css?v=1.8.0">
</head>
<body>
  <div class="login-screen">
    <div class="card login-card" style="max-width:420px;">
      <div class="login-logo">G</div>
      <div class="brand" style="margin-bottom:4px;">Guest<span>IQ</span></div>
      <p class="muted" style="margin-top:0;font-size:13px;">Activate this install</p>
      <p class="muted" style="margin-top:0;font-size:13px;">Enter the license key for this server to continue.</p>

      <div id="warnBox" class="hidden" style="color:var(--amber);font-size:12.5px;text-align:left;
        margin:0 0 12px;padding:10px 12px;border:1px solid rgba(245,158,11,.35);border-radius:10px;
        background:rgba(245,158,11,.08);"></div>
      <div id="errBox" class="hidden" style="color:var(--red);font-size:12.5px;text-align:left;
        margin:0 0 12px;padding:10px 12px;border:1px solid rgba(239,68,68,.35);border-radius:10px;
        background:rgba(239,68,68,.08);"></div>

      <label for="licenseKey">License key</label>
      <textarea id="licenseKey" rows="4" placeholder="WIQL1...."
        style="font-family:monospace;font-size:12px;word-break:break-all;"></textarea>

      <button class="btn" style="width:100%;margin-top:14px;" id="activateBtn" onclick="doActivate()">Activate</button>

      <div style="margin-top:22px;padding:14px;border:1px solid var(--border);border-radius:10px;
        background:var(--panel-2);text-align:left;">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
          <div style="min-width:0;">
            <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;">Server ID</div>
            <div id="serverId" style="font-family:monospace;font-size:12.5px;word-break:break-all;">—</div>
          </div>
          <button class="btn ghost sm" id="copyBtn" onclick="copyServerId()">Copy</button>
        </div>
        <p class="muted" style="font-size:11.5px;margin:8px 0 0;">
          Send this ID to get a license key issued for this server.
        </p>
      </div>
    </div>
  </div>

  <script src="/static/js/activate.js?v=1.8.0"></script>
</body>
</html>
